<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basic Chatroom</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="chat-container">
    <div class="chat-header">
      <h2>Basic Chatroom</h2>
    </div>

    <ul id="messages"></ul>

    <form id="chatForm">
      <input id="username" placeholder="Your Name" required />
      <input id="messageInput" placeholder="Type a message..." autocomplete="off" required />
      <button type="submit">Send</button>
    </form>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const form = document.getElementById('chatForm');
    const messageInput = document.getElementById('messageInput');
    const username = document.getElementById('username');
    const messages = document.getElementById('messages');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      if (messageInput.value) {
        socket.emit('chat message', {
          user: username.value,
          text: messageInput.value
        });
        messageInput.value = '';
      }
    });

    socket.on('chat message', (data) => {
      const item = document.createElement('li');
      item.innerHTML = `<strong>${data.user}</strong> ${data.text}`;
      messages.appendChild(item);
      messages.scrollTop = messages.scrollHeight;
    });
  </script>
</body>
</html>
